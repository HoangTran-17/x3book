[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "x3book"
version = "0.1.0"
description = "Tune EPUBs for the Xteink X3 running CrossVi: baseline JPEG, one TOC entry per file, PDF/Markdown to EPUB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Hoang Tran" }]
keywords = ["epub", "e-ink", "xteink", "crossvi", "ebook"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup",
]
dependencies = ["lxml>=5", "Pillow>=10.1", "pymupdf>=1.24"]

[project.optional-dependencies]
azw3 = ["mobi"]
dev = ["pytest>=8"]

[project.scripts]
x3book = "x3book.cli:main"

[tool.setuptools]
packages = ["x3book"]

[tool.pytest.ini_options]
testpaths = ["tests"]
